    <style>

        * {
            box-sizing: border-box;

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;

            color: #f4f7fb;

            overflow-x: hidden;

                    transparent 28%),

                radial-gradient(circle at 90% 20%,

                    rgba(0, 170, 255, 0.12),

        /* =========================
           FLOATING STICKERS
        ========================= */

        .sticker {
            position: fixed;
            z-index: 1;
            font-size: 30px;
            opacity: 0.18;
            pointer-events: none;
            user-select: none;
            animation: float 5s ease-in-out infinite;
        }

        .s1 {
            top: 12%;
            left: 7%;
        }

        .s2 {
            top: 27%;
            right: 7%;
            animation-delay: 1s;
        }

        .s3 {
            bottom: 23%;
            left: 8%;
            animation-delay: 2s;
        }

        .s4 {
            bottom: 10%;
            right: 9%;
            animation-delay: 3s;
        }

        .s5 {
            top: 55%;
            left: 4%;
            animation-delay: 1.5s;
        }

        .s6 {
            top: 70%;
            right: 4%;
            animation-delay: 2.5s;
        }

        @keyframes float {

            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-14px) rotate(6deg);
            }

        }


        /* =========================
           MAIN
        ========================= */

        .container {
            width: 92%;
            max-width: 760px;
            margin: auto;
            padding: 60px 0 45px;
            position: relative;
            z-index: 2;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            text-align: center;
            margin-bottom: 45px;
        }

        .avatar {
            width: 86px;
            height: 86px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 40px;

            background:
                linear-gradient(
                    135deg,
                    #00e5a0,
                    #695cff
                );

            box-shadow:
                0 0 35px rgba(0, 229, 160, 0.22),
                0 0 55px rgba(105, 92, 255, 0.18);
        }

        header h1 {
            margin: 0;
            font-size: 42px;
            letter-spacing: -1px;
        }

        header p {
            margin: 10px 0 0;
            color: #9ca7b5;
            font-size: 17px;
        }

        .tagline {
            margin-top: 14px;
            color: #d9dee7;
            font-size: 14px;
        }


        /* =========================
           CARD
        ========================= */

        .card {
            background: rgba(18, 23, 34, 0.82);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 20px;

            padding: 28px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.30);

            backdrop-filter: blur(12px);
        }
